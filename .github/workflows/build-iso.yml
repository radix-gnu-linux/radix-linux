name: build Radix GNU/Linux ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  repository_dispatch:
    types: [packages-updated, radix-updated]
  schedule:
    - cron: '17 7 * * 0'

permissions:
  contents: write

concurrency:
  group: radix-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RADIX_REQUIRE_KDE: '1'
      RADIX_REPOSITORY_URL: https://github.com/radix-gnu-linux/radix.git
      RADIX_PACKAGES_URL: https://github.com/radix-gnu-linux/radix-packages.git
      RADIX_LINUX_URL: https://github.com/radix-gnu-linux/radix-linux.git
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h

      - name: Install build and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl wget xxd gprolog bubblewrap cpio xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools qemu-system-x86 ovmf \
            musl-tools bc bison flex perl python3 python3-yaml openssl \
            libssl-dev libelf-dev kmod xz-utils bzip2 file lua5.4 rsync

      - name: Build and install Janet
        shell: bash
        env:
          JANET_VERSION: 1.41.2
          JANET_SHA256: 168e97e1b790f6e9d1e43685019efecc4ee473d6b9f8c421b49c195336c0b725
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/janet-${JANET_VERSION}.tar.gz"
          source_dir="$RUNNER_TEMP/janet-${JANET_VERSION}"
          rm -rf "$source_dir"
          mkdir -p "$source_dir"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/janet-lang/janet/archive/refs/tags/v${JANET_VERSION}.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$JANET_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" --strip-components=1 -C "$source_dir"
          make -C "$source_dir" -j"$(nproc)"
          make -C "$source_dir" test
          test -x "$source_dir/build/janet"
          test -f "$source_dir/build/janet.h"
          test -f "$source_dir/build/libjanet.a"
          sudo install -d /usr/local/bin /usr/local/include/janet /usr/local/lib
          sudo install -m 0755 "$source_dir/build/janet" /usr/local/bin/janet
          sudo install -m 0644 "$source_dir/build/janet.h" /usr/local/include/janet/janet.h
          sudo ln -sfn janet/janet.h /usr/local/include/janet.h
          sudo install -m 0644 "$source_dir/build/libjanet.a" /usr/local/lib/libjanet.a
          hash -r
          janet -v

      - name: Check out distro
        uses: actions/checkout@v6
        with:
          path: radix-linux
          persist-credentials: false

      - name: Check out Radix
        uses: actions/checkout@v6
        with:
          repository: radix-gnu-linux/radix
          path: radix
          persist-credentials: false

      - name: Check out package channel
        uses: actions/checkout@v6
        with:
          repository: radix-gnu-linux/radix-packages
          path: radix-packages
          persist-credentials: false

      - name: Check source trees
        run: |
          ./radix-linux/tools/check-tree
          ./radix-packages/tools/check-tree
          ./radix-linux/tools/check-package-contract ./radix-packages

      - name: Build Radix
        working-directory: radix
        run: make -j"$(nproc)" build

      - name: Radix release gate
        working-directory: radix
        run: make release-gate

      - name: Prepare canonical store
        run: |
          sudo mkdir -p /radix
          sudo chown -R "$USER":"$(id -gn)" /radix

      - name: Qualify and build KDE-first live ISO
        working-directory: radix-linux
        run: |
          set -o pipefail
          make iso \
            RADIX=../radix/build/radix \
            PACKAGES=../radix-packages \
            2>&1 | tee build-iso.log

      - name: Boot live ISO
        working-directory: radix-linux
        run: DIST="$PWD/dist" ./scripts/qemu-smoke.sh

      - name: Install and reboot disposable VM
        working-directory: radix-linux
        run: BUILD="$PWD/build" ./scripts/qemu-install-smoke.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: radix-build-log-${{ github.run_number }}
          path: radix-linux/build-iso.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v5
        with:
          name: radix-gnu-linux-${{ github.run_number }}
          path: |
            radix-linux/dist/*.iso
            radix-linux/dist/*.sha256
            radix-linux/dist/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --title "Radix GNU/Linux ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" radix-linux/dist/*.iso radix-linux/dist/*.sha256 radix-linux/dist/*.json \
            --repo "$GITHUB_REPOSITORY" --clobber
