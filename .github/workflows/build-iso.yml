name: build Radix GNU/Linux ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  repository_dispatch:
    types: [packages-updated, radix-updated]
  schedule:
    - cron: '17 7 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: build and test image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DEBIAN_FRONTEND: noninteractive
      JANET_VERSION: 1.41.2
      JANET_SHA256: 168e97e1b790f6e9d1e43685019efecc4ee473d6b9f8c421b49c195336c0b725
      RADIX_REQUIRE_KDE: '1'
    steps:
      - name: Check out distro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: radix-linux
          persist-credentials: false

      - name: Check release tag and version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: radix-linux
        run: |
          expected="v$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "release tag $GITHUB_REF_NAME does not match VERSION $expected" >&2
            exit 1
          fi

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h

      - name: Install build and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates wget xxd gprolog bubblewrap cpio xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools qemu-system-x86 ovmf \
            musl-tools bc bison flex perl python3 python3-yaml openssl \
            libssl-dev libelf-dev kmod xz-utils bzip2 file lua5.4 rsync

      - name: Build Janet
        run: |
          source="$RUNNER_TEMP/janet.tar.gz"
          mkdir -p "$RUNNER_TEMP/janet"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/janet-lang/janet/archive/refs/tags/v${JANET_VERSION}.tar.gz" \
            --output "$source"
          printf '%s  %s\n' "$JANET_SHA256" "$source" | sha256sum --check --strict
          tar -xzf "$source" --strip-components=1 -C "$RUNNER_TEMP/janet"
          make -C "$RUNNER_TEMP/janet" -j"$(nproc)"
          sudo make -C "$RUNNER_TEMP/janet" install
          janet -v

      - name: Check out Radix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: radix-gnu-linux/radix
          path: radix
          persist-credentials: false

      - name: Check out package channel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: radix-gnu-linux/radix-packages
          path: radix-packages
          persist-credentials: false

      - name: Check source trees
        run: |
          ./radix-linux/tools/check-tree
          ./radix-packages/tools/check-tree
          ./radix-linux/tools/check-package-contract ./radix-packages

      - name: Build Radix
        working-directory: radix
        run: make -j"$(nproc)" build

      - name: Radix release gate
        working-directory: radix
        run: make release-gate

      - name: Prepare canonical store
        run: |
          sudo mkdir -p /radix
          sudo chown -R "$USER":"$(id -gn)" /radix

      - name: Qualify and build KDE-first live ISO
        working-directory: radix-linux
        run: |
          set -o pipefail
          make iso RADIX=../radix/build/radix PACKAGES=../radix-packages 2>&1 | tee build-iso.log

      - name: Boot live ISO
        working-directory: radix-linux
        run: DIST="$PWD/dist" ./scripts/qemu-smoke.sh

      - name: Install and reboot disposable VM
        working-directory: radix-linux
        run: BUILD="$PWD/build" ./scripts/qemu-install-smoke.sh

      - name: Verify image checksums
        working-directory: radix-linux/dist
        run: sha256sum -c ./*.sha256

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: radix-build-log-${{ github.run_number }}
          path: radix-linux/build-iso.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ISO artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: radix-gnu-linux-${{ github.run_id }}
          path: |
            radix-linux/dist/*.iso
            radix-linux/dist/*.sha256
            radix-linux/dist/*.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

  publish:
    name: publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: iso
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download tested release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: radix-gnu-linux-${{ github.run_id }}
          path: release-assets

      - name: Verify downloaded checksums
        working-directory: release-assets
        run: sha256sum -c ./*.sha256

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --title "Radix GNU/Linux ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" release-assets/*.iso release-assets/*.sha256 release-assets/*.json \
            --repo "$GITHUB_REPOSITORY" --clobber
