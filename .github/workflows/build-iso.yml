name: build installable Radix GNU/Linux KDE ISO

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [packages-updated, radix-updated]

permissions:
  contents: read

concurrency:
  group: radix-kde-test-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: build, install and boot KDE image
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      DEBIAN_FRONTEND: noninteractive
      JANET_VERSION: 1.41.2
      JANET_SHA256: 168e97e1b790f6e9d1e43685019efecc4ee473d6b9f8c421b49c195336c0b725
      RADIX_REQUIRE_KDE: '0'
      RADIX_KDE_PREVIEW: '1'
      # GitHub-hosted runners can reject bubblewrap's loopback setup inside
      # a private network namespace. Keep strict sandboxing, but let package
      # builds share the runner network namespace.
      RADIX_SANDBOX_NETWORK: host

    steps:
      - name: Check out distro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: radix-linux
          persist-credentials: false

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h

      - name: Install build, desktop-image and VM tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates wget xxd \
            gprolog bubblewrap cpio xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools \
            qemu-system-x86 ovmf \
            musl-tools bc bison flex perl python3 python3-yaml \
            openssl libssl-dev libelf-dev kmod \
            xz-utils bzip2 gzip file lua5.4 rsync \
            debootstrap

      - name: Build and install Janet
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/janet-${JANET_VERSION}.tar.gz"
          source_dir="$RUNNER_TEMP/janet-${JANET_VERSION}"

          rm -rf "$source_dir"
          mkdir -p "$source_dir"

          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/janet-lang/janet/archive/refs/tags/v${JANET_VERSION}.tar.gz" \
            --output "$archive"

          printf '%s  %s\n' "$JANET_SHA256" "$archive" |
            sha256sum --check --strict

          tar -xzf "$archive" --strip-components=1 -C "$source_dir"

          make -C "$source_dir" -j"$(nproc)"
          make -C "$source_dir" test

          test -x "$source_dir/build/janet"
          test -f "$source_dir/build/janet.h"
          test -f "$source_dir/build/libjanet.a"

          sudo install -d /usr/local/bin /usr/local/include/janet /usr/local/lib
          sudo install -m0755 "$source_dir/build/janet" /usr/local/bin/janet
          sudo install -m0644 "$source_dir/build/janet.h" /usr/local/include/janet/janet.h
          sudo ln -sfn janet/janet.h /usr/local/include/janet.h
          sudo install -m0644 "$source_dir/build/libjanet.a" /usr/local/lib/libjanet.a

          hash -r
          janet -v

      - name: Check out Radix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: radix-gnu-linux/radix
          path: radix
          persist-credentials: false

      - name: Check out package channel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: radix-gnu-linux/radix-packages
          path: radix-packages
          persist-credentials: false

      - name: Check source trees
        shell: bash
        run: |
          set -euo pipefail
          ./radix-linux/tools/check-tree
          ./radix-packages/tools/check-tree
          RADIX_REQUIRE_KDE=0 ./radix-linux/tools/check-package-contract ./radix-packages

      - name: Show native KDE promotion status
        continue-on-error: true
        shell: bash
        run: |
          echo 'Native Radix KDE status (diagnostic only for the bootstrap preview):'
          RADIX_REQUIRE_KDE=1 ./radix-linux/tools/check-package-contract ./radix-packages

      - name: Build Radix
        working-directory: radix
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(nproc)" build
          test -x build/radix
          ./build/radix --version

      - name: Radix release gate
        working-directory: radix
        shell: bash
        run: |
          set -euo pipefail
          make release-gate

      - name: Prepare canonical Radix store
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /radix
          sudo chown -R "$USER":"$(id -gn)" /radix

      - name: Build KDE bootstrap preview payload
        working-directory: radix-linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          set +e
          make kde-preview 2>&1 | tee build/kde-preview-ci.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            echo
            echo '=== KDE preview build failed ==='
            tail -n 200 build/kde-preview-ci.log || true

            if [ -f build/kde-preview/rootfs/var/log/apt/term.log ]; then
              echo
              echo '=== apt terminal log ==='
              sudo tail -n 300 build/kde-preview/rootfs/var/log/apt/term.log || true
            fi

            if [ -f build/kde-preview/rootfs/var/log/dpkg.log ]; then
              echo
              echo '=== dpkg log ==='
              sudo tail -n 300 build/kde-preview/rootfs/var/log/dpkg.log || true
            fi

            exit "$status"
          fi

          test -s build/kde-preview/kde-preview-rootfs.tar.gz
          test -s build/kde-preview/manifest
          test -s build/kde-preview/packages.tsv

          cat build/kde-preview/desktop-versions.txt
          ls -lh build/kde-preview/kde-preview-rootfs.tar.gz

      - name: Build installable KDE ISO
        working-directory: radix-linux
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          RADIX_PATH="${GITHUB_WORKSPACE}/radix/build/radix"
          PACKAGES_PATH="${GITHUB_WORKSPACE}/radix-packages"
          BUILD_PATH="${GITHUB_WORKSPACE}/radix-linux/build"
          DIST_PATH="${GITHUB_WORKSPACE}/radix-linux/dist"

          test -x "$RADIX_PATH"
          test -d "$PACKAGES_PATH/pkgs"

          mkdir -p "$BUILD_PATH" "$DIST_PATH"

          echo "Radix binary:    $RADIX_PATH"
          echo "Package channel: $PACKAGES_PATH"
          echo "Build directory: $BUILD_PATH"
          echo "ISO directory:   $DIST_PATH"

          make iso-preview \
            RADIX="$RADIX_PATH" \
            PACKAGES="$PACKAGES_PATH" \
            BUILD="$BUILD_PATH" \
            DIST="$DIST_PATH" \
            2>&1 | tee build-iso.log

          test -s dist/radix-live.iso
          test -s dist/radix-live.iso.sha256

          xorriso -indev dist/radix-live.iso \
            -find /radix/payload/kde-preview-rootfs.tar.gz -type f -print \
            2>/dev/null | grep -q kde-preview-rootfs.tar.gz

          xorriso -indev dist/radix-live.iso \
            -find /radix/payload/kde-preview-rootfs.tar.gz.sha256 -type f -print \
            2>/dev/null | grep -q kde-preview-rootfs.tar.gz.sha256

          xorriso -indev dist/radix-live.iso \
            -find /radix/tools/bin/mkfs.ext4 -type f -print \
            2>/dev/null | grep -q /radix/tools/bin/mkfs.ext4

          ls -lh dist/radix-live.iso dist/radix-live.iso.sha256

      - name: Upload KDE test ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: radix-gnu-linux-kde-test-${{ github.run_number }}
          path: |
            radix-linux/dist/radix-live.iso
            radix-linux/dist/radix-live.iso.sha256
            radix-linux/dist/build-info.json
            radix-linux/build/kde-preview/manifest
            radix-linux/build/kde-preview/desktop-versions.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Boot live ISO in QEMU
        working-directory: radix-linux
        shell: bash
        run: |
          set -euo pipefail
          DIST="$PWD/dist" ./scripts/qemu-smoke.sh

      - name: Install KDE and reboot disposable VM
        working-directory: radix-linux
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$PWD/build" DIST="$PWD/dist" \
            RADIX_VM_MEMORY=6144M RADIX_VM_CPUS=4 \
            ./scripts/qemu-install-smoke.sh

      - name: Verify ISO checksum
        working-directory: radix-linux/dist
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c radix-live.iso.sha256

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: radix-kde-build-log-${{ github.run_number }}
          path: |
            radix-linux/build-iso.log
            radix-linux/build/kde-preview-ci.log
            radix-linux/build/kde-preview/manifest
            radix-linux/build/kde-preview/desktop-versions.txt
            radix-linux/build/kde-preview/packages.tsv
            radix-linux/build/kde-preview/logs/apt-term.log
            radix-linux/build/kde-preview/logs/dpkg.log
            radix-linux/build/kde-preview/rootfs/var/log/apt/term.log
            radix-linux/build/kde-preview/rootfs/var/log/dpkg.log
          if-no-files-found: warn
          retention-days: 14
